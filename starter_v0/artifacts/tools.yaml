# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi người dùng một câu ngắn trong hai trường hợp: (a) THIẾU thông tin bắt buộc (handle tài khoản, URL, chủ đề tìm kiếm) → response_type=text; (b) MỌI yêu cầu gửi, đăng hoặc ghi (kể cả khi chưa rõ nội dung) → BẮT BUỘC response_type=yes_no, ví dụ 'Bạn muốn đăng nội dung này lên Telegram không?'. KHÔNG dùng khi đã có đủ thông tin để gọi tool khác. KHÔNG dùng cho yêu cầu ngoài phạm vi research (đặt vé, mua hàng, thao tác tài khoản, lập trình): khi đó trả lời trực tiếp rằng agent không làm được việc đó và không gọi tool."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi ngắn, nêu rõ thông tin còn thiếu"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "text khi hỏi thông tin còn thiếu; yes_no BẮT BUỘC khi xin xác nhận gửi, đăng hoặc ghi (kể cả khi chưa rõ nội dung); choice khi đưa ra các lựa chọn trong options"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn, chỉ dùng khi response_type=choice"}
      required: [question, response_type]

  - name: timeline
    description: "Lấy các bài đăng gần đây của MỘT tài khoản cụ thể. Dùng khi người dùng nêu rõ tên tài khoản (ví dụ 'tweet của @sama', 'sama vừa đăng gì'). KHÔNG dùng để tìm theo từ khóa (dùng social_search). KHÔNG dùng khi chưa biết tài khoản (dùng clarify). Nếu người dùng nêu tên người nổi tiếng, đổi sang handle: Yann LeCun → ylecun; Sam Altman → sama; Demis Hassabis → demishassabis."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle KHÔNG kèm '@' (ví dụ '@sama' → 'sama'; 'Yann LeCun' → 'ylecun')"}
        limit: {type: integer, default: 5, description: "Số bài cần lấy. Dùng đúng số người dùng yêu cầu (ví dụ 'lấy 3 bài' → 3); mặc định 5"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng trên mạng xã hội theo từ khóa hoặc chủ đề, hoặc tìm thảo luận về một chủ đề. KHÔNG dùng khi người dùng hỏi bài của một tài khoản cụ thể (dùng timeline). KHÔNG dùng để tra cứu tin tức báo chí (dùng lookup với topic=news)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa chủ đề, không kèm '@' và không kèm từ 'tweets' hay 'news'"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Top khi người dùng muốn bài nổi bật/phổ biến; Latest (mặc định) khi muốn bài mới nhất"}
        limit: {type: integer, default: 5, description: "Số bài cần lấy; mặc định 5"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin, sự kiện, hoặc tin tức trên web. Dùng topic=news cho tin tức báo chí. KHÔNG dùng để đọc nội dung một URL cụ thể (dùng fetch). KHÔNG dùng để tìm bài trên mạng xã hội (dùng social_search)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề ngắn gọn; không thêm từ 'news' hay 'tin tức' vào query khi đã đặt topic=news"}
        topic: {type: string, enum: [general, news], default: "general", description: "news khi người dùng hỏi tin tức; general cho các truy vấn khác"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "day cho 'hôm nay'; week cho 'tuần này' hoặc khi không nói; month/year cho khoảng dài hơn"}
        max_results: {type: integer, default: 5, description: "Số kết quả; mặc định 5"}
      required: [query]

  - name: fetch
    description: "Đọc nội dung của MỘT URL cụ thể do người dùng đưa ra. Khi tin nhắn có link http/https, dùng fetch NGAY, kể cả khi yêu cầu là 'tóm tắt', 'đọc', 'bài này' — không hỏi lại. KHÔNG dùng khi chưa có URL (dùng clarify). KHÔNG dùng để tìm kiếm (dùng lookup hoặc social_search)."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL đầy đủ, bắt đầu bằng http:// hoặc https://"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi văn bản lên Telegram. CHỈ gọi khi người dùng đã xem nội dung cuối và xác nhận rõ ràng. Lần gửi đầu tiên trong hội thoại LUÔN phải hỏi xác nhận bằng clarify với response_type=yes_no, kể cả khi người dùng nói 'ok', 'gửi luôn' hay 'gửi đi'. Chỉ đặt confirmed=true sau khi người dùng đã trả lời yes cho câu hỏi xác nhận đó."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "false ở lần gọi đầu tiên trong hội thoại, kể cả khi người dùng nói 'ok' hay 'gửi luôn'; true chỉ sau khi clarify yes_no đã được trả lời yes"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: research_deduplicate
    description: "Loại bỏ kết quả trùng lặp trong một danh sách kết quả đã có (so khớp URL sau khi chuẩn hóa). Dùng khi đã có nhiều kết quả từ lookup, social_search hoặc fetch và cần gộp các bài trùng. KHÔNG dùng để tìm thông tin mới. KHÔNG dùng khi chưa có danh sách kết quả."
    parameters:
      type: object
      properties:
        items: {type: array, default: [], description: "Danh sách kết quả; mỗi phần tử là object có trường url (và title nếu có)", items: {type: object}}
      required: [items]
